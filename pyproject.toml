[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sophy"
version = "0.1.0"
description = "A coding agent harness"
requires-python = ">=3.11"
dependencies = [
    "smolagents",
    "requests",
    "prompt_toolkit",
    "questionary",
]

[project.scripts]
sophy = "sophy:main"
