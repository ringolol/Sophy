[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sophy"
version = "0.1.0"
description = "A coding agent harness"
requires-python = ">=3.11"
dependencies = [
    "smolagents[toolkit,openai]",
    "prompt_toolkit",
    "questionary",
    "aiogram>=3.0",
    "aiohttp-socks",
]

[project.scripts]
sophy = "sophy:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
# optional: other settings

[[tool.mypy.overrides]]
module = "smolagents.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiogram.*"
ignore_missing_imports = true
